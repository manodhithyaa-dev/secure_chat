# SecureChat — single-port deployment.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Only the `web` (nginx) service publishes a port, and only on loopback. It
# serves the built SPA and reverse-proxies /api and /socket.io to the internal
# `server` container. To publish it to a Tailscale tailnet over HTTPS, run
# `tailscale serve --https=443 http://127.0.0.1:8080` on the host. See
# docs/DEPLOYMENT.md.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: securechat-server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_FILE: /data/securechat.sqlite
      ATTACHMENT_DIR: /data/attachments
      # Public origin users reach the app on. Used for CORS / Socket.IO checks.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Cookies are Secure only when traffic is served over HTTPS. Keep this
      # false for plain-HTTP local use; set true behind a TLS terminator (e.g.
      # Tailscale Serve, which provisions a trusted *.ts.net certificate).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # WebRTC ICE servers. On a Tailscale tailnet peers are directly reachable,
      # so STUN is optional and TURN is usually unnecessary. The `-` (not `:-`)
      # default lets an explicitly empty RTC_STUN_SERVERS disable STUN.
      RTC_STUN_SERVERS: ${RTC_STUN_SERVERS-stun:stun.l.google.com:19302}
      RTC_TURN_URL: ${RTC_TURN_URL:-}
      RTC_TURN_USERNAME: ${RTC_TURN_USERNAME:-}
      RTC_TURN_CREDENTIAL: ${RTC_TURN_CREDENTIAL:-}
    volumes:
      - securechat-data:/data
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: securechat-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Loopback-only: reachable by the host's Tailscale Serve (or a local
      # browser), never exposed directly on the LAN or tailnet.
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  securechat-data:
