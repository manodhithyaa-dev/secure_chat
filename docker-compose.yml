# SecureChat — single-port deployment.
#
#   docker compose up --build
#   open http://localhost:8080
#
# Only the `web` (nginx) service publishes a port. It serves the built SPA and
# reverse-proxies /api and /socket.io to the internal `server` container.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: securechat-server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_FILE: /data/securechat.sqlite
      ATTACHMENT_DIR: /data/attachments
      # Public origin users reach the app on. Used for CORS / Socket.IO checks.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # Cookies are Secure only when traffic is served over HTTPS. Keep this
      # false for plain-HTTP local use; set true behind a TLS terminator.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - securechat-data:/data
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: securechat-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  securechat-data:
